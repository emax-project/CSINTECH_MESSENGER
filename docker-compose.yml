services:
  # HTTPS 리버스 프록시. CADDY_DOMAIN(예: msg.csin.kr)으로 들어오는 80/443 요청을
  # server 컨테이너로 넘기고, Let's Encrypt 인증서 발급·갱신을 자동으로 처리한다.
  # 전제조건: CADDY_DOMAIN이 이 서버의 공인 IP를 가리키도록 DNS A레코드가 설정돼
  # 있어야 하고, 방화벽에서 80·443 포트가 이 서버로 포워딩돼 있어야 한다
  # (80은 인증서 발급용 HTTP-01 챌린지에 필요 — 발급 후에도 계속 열려 있어야
  # 갱신이 된다). CADDY_DOMAIN이 비어 있으면(.env 미설정) Caddy는 그냥 80/443을
  # 평문으로 리슨한다 — HTTPS 전환 전 기존 클라이언트들에 영향 없음.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: message
      POSTGRES_PASSWORD: message
      POSTGRES_DB: message
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U message -d message"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://message:message@db:5432/message
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      # 관리자 이메일(쉼표 구분). 비어 있으면 관리자 기능이 아무에게도 열리지 않는다.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      UPLOAD_DIR: /app/uploads
      # 거래처 조직 sync (CSIN-Tech 배포 시 .env 에 PARTNER_* 설정)
      PARTNER_ORG_SOURCE: ${PARTNER_ORG_SOURCE:-off}
      PARTNER_COMPANY_NAME: ${PARTNER_COMPANY_NAME:-CSIN}
      PARTNER_COMPANY_EXTERNAL_CODE: ${PARTNER_COMPANY_EXTERNAL_CODE:-CSIN}
      PARTNER_MSSQL_SERVER: ${PARTNER_MSSQL_SERVER:-}
      PARTNER_MSSQL_PORT: ${PARTNER_MSSQL_PORT:-1433}
      PARTNER_MSSQL_DATABASE: ${PARTNER_MSSQL_DATABASE:-}
      PARTNER_MSSQL_USER: ${PARTNER_MSSQL_USER:-}
      PARTNER_MSSQL_PASSWORD: ${PARTNER_MSSQL_PASSWORD:-}
      PARTNER_MSSQL_ENCRYPT: ${PARTNER_MSSQL_ENCRYPT:-false}
      PARTNER_MSSQL_TRUST_CERT: ${PARTNER_MSSQL_TRUST_CERT:-true}
      # createMissingUsers 사용 시 필수 — 기본값을 두지 않는다 (약한 공용 비밀번호 방지).
      # 신규 계정은 최초 로그인 시 비밀번호 변경이 강제된다 (mustChangePassword).
      PARTNER_DEFAULT_PASSWORD: ${PARTNER_DEFAULT_PASSWORD:-}
      LDAP_ENABLED: ${LDAP_ENABLED:-false}
      LDAP_URL: ${LDAP_URL:-ldaps://ldap.csin.kr:636}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-dc=ldap,dc=csin,dc=kr}
      LDAP_SEARCH_BASE: ${LDAP_SEARCH_BASE:-cn=users,dc=ldap,dc=csin,dc=kr}
      LDAP_SEARCH_FILTER: ${LDAP_SEARCH_FILTER:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_EMAIL_DOMAIN: ${LDAP_EMAIL_DOMAIN:-csin.kr}
      LDAP_TLS_REJECT_UNAUTHORIZED: ${LDAP_TLS_REJECT_UNAUTHORIZED:-true}
      LDAP_LOCAL_EXCEPTIONS: ${LDAP_LOCAL_EXCEPTIONS:-}
    # ldap.csin.kr은 사내망 전용 도메인이라 공인 DNS로 못 찾는다. 컨테이너
    # 내부 /etc/hosts에 직접 등록해서, 호스트 머신의 hosts 파일/DNS 설정과
    # 무관하게 항상 붙도록 한다. (IP가 바뀌면 이 값도 같이 바꿔야 함)
    extra_hosts:
      - "ldap.csin.kr:192.168.123.247"
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - upload_data:/app/uploads

volumes:
  postgres_data:
  upload_data:
  caddy_data:
  caddy_config:
