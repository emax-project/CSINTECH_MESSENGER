<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CSIN-Tech - 팀 협업 메신저. 채팅, 일정, 칸반, 간트 차트로 프로젝트를 효율적으로 관리하세요." />
    <link rel="icon" type="image/png" href="/emax-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" /></noscript>
    <title>CSIN-Tech</title>
    <style>html,body{margin:0;padding:0;}#root{min-height:100vh;width:100%;display:flex;flex-direction:column;}</style>
  </head>
  <body class="theme-light">
    <div id="root"><p id="app-loading" style="color:#94a3b8;padding:24px;font-size:15px;">로딩 중...</p></div>
    <script>
      setTimeout(function(){
        var el = document.getElementById('app-loading');
        if (el && el.parentNode && el.parentNode.id === 'root') {
          el.innerHTML = '페이지를 불러오지 못했습니다. 네트워크를 확인하거나 새로고침해 주세요.';
          el.style.color = '#dc2626';
        }
      }, 12000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
