# 서버 PC의 Docker에 자동 배포
# main 브랜치에 push 하거나, Actions 탭에서 수동 실행 가능
# 웹 클라이언트(React)도 Docker 빌드 단계에서 포함됩니다.
# Runner에는 Docker만 있으면 됨 (Node/npm 불필요).
#
# Docker Desktop 라이선스 정책(250인/매출 1천만 달러 초과 기업 유료) 때문에,
# Docker Desktop 대신 WSL2 안에 Docker Engine을 직접 설치해 쓴다(완전 무료,
# Apache-2.0). Windows 쪽 러너는 CLI만 설치하고 DOCKER_HOST로 WSL2 안의
# 데몬(tcp://localhost:2375, WSL2 localhost 포워딩 경유)에 접속한다.
# 서버 쪽 설정은 docs/wsl2-docker-engine-setup.md 참고.

name: Deploy to Server (Docker)

on:
  push:
    branches: [main]
  workflow_dispatch:  # 수동 실행

env:
  # WSL2 안의 Docker Engine(데몬)에 접속. 127.0.0.1만 바인딩하고 WSL2 localhost
  # 포워딩으로 Windows에서도 보이게 해 둔 전제 — docs/wsl2-docker-engine-setup.md 참고.
  DOCKER_HOST: tcp://localhost:2375

jobs:
  # 배포 전에 서버·클라이언트 테스트를 돌린다. 실패하면 서버 PC에 배포하지 않는다.
  # (GitHub 호스팅 러너에서 실행 — 서버 PC에는 Node가 없다)
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # postinstall에서 prisma generate가 실행된다(서버 테스트에 필요). electron 바이너리는 필요 없다.
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Test (client + server)
        run: npm test

  deploy:
    needs: test
    # 서버 PC에 설치한 self-hosted runner에서 실행됩니다
    runs-on: [self-hosted, server]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 러너가 Windows 서비스(SYSTEM 계정)로 떠서 사용자 계정 PATH를 못 물려받는다.
      # 머신 전체 PATH를 고치면 서비스가 부팅 시 캐시한 환경을 재부팅 전까지
      # 갱신하지 않으므로, 이 잡에서만 PATH에 추가한다.
      # docker.exe/docker-compose.exe는 Docker Desktop이 아니라 CLI만 따로 받아
      # C:\docker-cli 에 둔 것 — docs/wsl2-docker-engine-setup.md 참고.
      - name: Ensure Docker CLI is on PATH
        shell: powershell
        run: |
          $dockerBin = "C:\docker-cli"
          if (Test-Path $dockerBin) {
            Add-Content -Path $env:GITHUB_PATH -Value $dockerBin
          } else {
            Write-Error "Docker CLI 경로를 찾을 수 없습니다: $dockerBin (설치 경로가 바뀌었다면 이 워크플로를 수정하세요)"
            exit 1
          }

      - name: Docker Compose build (no cache)
        run: docker compose build --no-cache

      - name: Docker Compose up
        run: docker compose up -d
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          # HTTPS 도메인(예: msg.csin.kr). 저장소 Settings > Secrets에 등록하면
          # Caddy가 Let's Encrypt 인증서를 자동 발급한다 — 비어 있으면 평문 80으로
          # 동작(기존 클라이언트 영향 없음). docker-compose.yml의 caddy 서비스 참고.
          CADDY_DOMAIN: ${{ secrets.CADDY_DOMAIN }}
          # 저장소 Settings > Secrets에 ADMIN_EMAIL을 등록해야 관리자 기능이 열린다
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          # Synology LDAP 연동 (CSIN-Tech 직원 로그인)
          LDAP_ENABLED: ${{ secrets.LDAP_ENABLED }}
          LDAP_URL: ${{ secrets.LDAP_URL }}
          LDAP_BASE_DN: ${{ secrets.LDAP_BASE_DN }}
          LDAP_SEARCH_BASE: ${{ secrets.LDAP_SEARCH_BASE }}
          LDAP_SEARCH_FILTER: ${{ secrets.LDAP_SEARCH_FILTER }}
          LDAP_BIND_DN: ${{ secrets.LDAP_BIND_DN }}
          LDAP_BIND_PASSWORD: ${{ secrets.LDAP_BIND_PASSWORD }}
          LDAP_EMAIL_DOMAIN: ${{ secrets.LDAP_EMAIL_DOMAIN }}
          LDAP_TLS_REJECT_UNAUTHORIZED: ${{ secrets.LDAP_TLS_REJECT_UNAUTHORIZED }}
          # LDAP 대신 로컬 비밀번호로 로그인할 예외 계정 (쉼표로 구분)
          LDAP_LOCAL_EXCEPTIONS: ${{ secrets.LDAP_LOCAL_EXCEPTIONS }}
          # 거래처 MSSQL 조직도 연동
          PARTNER_ORG_SOURCE: ${{ secrets.PARTNER_ORG_SOURCE }}
          PARTNER_COMPANY_NAME: ${{ secrets.PARTNER_COMPANY_NAME }}
          PARTNER_COMPANY_EXTERNAL_CODE: ${{ secrets.PARTNER_COMPANY_EXTERNAL_CODE }}
          PARTNER_MSSQL_SERVER: ${{ secrets.PARTNER_MSSQL_SERVER }}
          PARTNER_MSSQL_PORT: ${{ secrets.PARTNER_MSSQL_PORT }}
          PARTNER_MSSQL_DATABASE: ${{ secrets.PARTNER_MSSQL_DATABASE }}
          PARTNER_MSSQL_USER: ${{ secrets.PARTNER_MSSQL_USER }}
          PARTNER_MSSQL_PASSWORD: ${{ secrets.PARTNER_MSSQL_PASSWORD }}
          PARTNER_MSSQL_ENCRYPT: ${{ secrets.PARTNER_MSSQL_ENCRYPT }}
          PARTNER_MSSQL_TRUST_CERT: ${{ secrets.PARTNER_MSSQL_TRUST_CERT }}
          PARTNER_DEFAULT_PASSWORD: ${{ secrets.PARTNER_DEFAULT_PASSWORD }}

      # WSL2 환경에서 Windows의 IPv4 루프백(127.0.0.1) → WSL2 포워딩이 간헐적으로
      # 끊기는 문제가 있다(2026-10-22 확인 — IPv6 루프백(::1)은 항상 정상 동작).
      # 그래서 외부/LAN IP(0.0.0.0)로 들어온 요청을 WSL2로 넘기는 netsh portproxy는
      # 반드시 connectaddress=::1(IPv6)을 써야 한다 — 127.0.0.1로 하면 컨테이너가
      # 재배포될 때마다 접속 불가 상태에 빠진다. 컨테이너 재생성 때마다 매번 수동
      # 재등록하지 않도록 배포 직후 항상 재적용한다(멱등 — 이미 같은 규칙이면 just no-op).
      - name: Re-assert IPv4→IPv6 portproxy rules (WSL2 loopback workaround)
        shell: powershell
        run: |
          $ports = @(80, 443, 3001)
          foreach ($p in $ports) {
            netsh interface portproxy delete v4tov4 listenport=$p listenaddress=0.0.0.0 2>$null | Out-Null
            netsh interface portproxy delete v4tov6 listenport=$p listenaddress=0.0.0.0 2>$null | Out-Null
            netsh interface portproxy add v4tov6 listenport=$p listenaddress=0.0.0.0 connectport=$p connectaddress=::1
          }
          netsh interface portproxy show all

      # 컨테이너가 "시작"만 하고 곧바로 죽는 경우(예: 1.3.0의 prisma db push 실패로 재시작 반복)에도
      # 배포가 성공으로 끝나지 않도록, 서버가 실제로 응답할 때까지 기다리고 DB 연결까지 확인한다.
      # 서버는 시작할 때 prisma db push를 하므로 1~2분 걸릴 수 있다. ::1을 쓰는 이유는 위 portproxy 주석 참고.
      - name: Wait for server health
        shell: powershell
        run: |
          $ok = $false
          for ($i = 1; $i -le 36; $i++) {
            Start-Sleep -Seconds 5
            try {
              $r = Invoke-WebRequest -Uri "http://[::1]:3001/health/db" -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true; Write-Host "서버 응답 확인 ($($i * 5)초): $($r.Content)"; break }
            } catch { Write-Host "대기 중... ($($i * 5)초) $($_.Exception.Message)" }
          }
          if (-not $ok) {
            docker compose ps
            docker compose logs server --tail 80
            Write-Error "서버가 3분 안에 응답하지 않았습니다. 위 server 로그를 확인하세요."
            exit 1
          }

      - name: Log result
        if: always()
        run: |
          docker compose ps
