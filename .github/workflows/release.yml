# 릴리즈 설치파일 자동 빌드/배포
# v* 태그를 push 하면 macOS(.dmg)와 Windows(.exe) 설치파일을 빌드해
# 같은 태그의 GitHub Release 에 업로드합니다. (GitHub 호스팅 러너 사용)
# 수동 실행 시에도 태그를 지정하면 동작합니다.

name: Release Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build_script: electron:build:mac
          - os: windows-latest
            build_script: electron:build:win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        working-directory: packages/client
        shell: bash
        env:
          # 거래처 사외 API — HTTPS 전환 완료(Caddy/사내 리버스 프록시 → 192.168.123.210:3001),
          # 2026-10-23 end-to-end 검증 완료 후 평문 http://121.143.3.163:3030 에서 전환
          VITE_API_URL: https://msg.csin.kr
          # ── 코드 서명 (저장소 Settings > Secrets 에 등록하면 자동으로 서명된다) ──
          # CSC_LINK: 인증서(.pfx / .p12) 파일을 base64로 인코딩한 값 또는 https URL
          # CSC_KEY_PASSWORD: 인증서 비밀번호
          # Windows는 인증서의 CN이 업데이트 서명 검증용 발행자 이름(publisherName)으로 자동 설정되어,
          # 이후 자동 업데이트 때 "같은 발행자가 서명한 설치 파일인지"까지 검증한다.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # macOS 공증(notarization): 아래 3개가 모두 있으면 자동으로 공증한다
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # 시크릿이 등록되지 않았으면 빈 문자열로 들어오는데, electron-builder는 빈 CSC_LINK를
          # 경로로 해석해 macOS 빌드가 "packages/client not a file"로 실패한다. 빈 값은 아예 지운다.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          args=()
          if [ -n "$CSC_LINK" ]; then
            # 서명 실패를 조용히 넘기고 서명 안 된 파일이 배포되는 일이 없도록 실패 처리한다
            args+=(--config.forceCodeSigning=true)
          else
            echo "::warning::코드 서명 인증서(CSC_LINK 시크릿)가 없어 서명되지 않은 설치 파일이 만들어집니다. 배포 전에 인증서를 등록하세요."
          fi
          npm run build:icon
          npm run "${{ matrix.build_script }}" -- ${args[@]+"${args[@]}"}

      - name: Upload installers to release
        uses: softprops/action-gh-release@v2
        with:
          name: CSIN-Tech ${{ github.ref_name }}
          files: |
            packages/client/release/*.dmg
            packages/client/release/*.exe
            packages/client/release/*-mac.zip
            packages/client/release/latest*.yml
            packages/client/release/*.blockmap
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
